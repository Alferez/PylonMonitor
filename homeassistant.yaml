# Configuración para Home Assistant - Pylontech Battery Monitor
# Copia este contenido a tu configuration.yaml o a un archivo separado

# For Different Batteries
# replace "Battery 1" to "Battery X" and "battery_pack_1" to "battery_pack_X" 


  - name: "Battery 1 Pack Voltage"
    state_topic: "pylontech/monitor/battery_pack_1_pack_voltage"
    unit_of_measurement: "V"
    device_class: voltage
    icon: mdi:battery-high

  - name: "Battery 1 Pack Current"
    state_topic: "pylontech/monitor/battery_pack_1_pack_current"
    unit_of_measurement: "A"
    device_class: current
    icon: mdi:current-dc

  - name: "Battery 1 State of Charge"
    state_topic: "pylontech/monitor/battery_pack_1_state_of_charge"
    unit_of_measurement: "%"
    device_class: battery
    icon: mdi:battery-100

  - name: "Battery 1 Delta V"
    state_topic: "pylontech/monitor/battery_pack_1_delta_v"
    unit_of_measurement: "mV"
    icon: mdi:battery-alert

